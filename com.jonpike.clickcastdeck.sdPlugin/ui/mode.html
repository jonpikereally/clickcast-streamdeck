<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="row">
  <label>Press does</label>
  <select name="mode" data-default="toggle">
    <option value="toggle">Toggle</option>
    <option value="shortcuts">Shortcuts only</option>
    <option value="all">Everything I type</option>
  </select>
</div>
<p class="hint">Shortcuts only shows chords with ⌘ ⌃ ⌥ and special keys. Everything I type also streams plain typing.</p>
<script src="pi.js"></script></body></html>
