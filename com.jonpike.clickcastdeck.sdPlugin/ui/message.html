<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="row">
  <label>Text</label>
  <input type="text" name="text" data-default="Watch this" maxlength="60">
</div>
<div class="row">
  <label>Show for</label>
  <input type="number" name="seconds" min="0.5" max="30" step="0.5" data-default="2.5"> s
</div>
<p class="hint">Flashes the text in the keystroke pill. Handy for “Watch this”, chapter titles, or a reminder to yourself.</p>
<script src="pi.js"></script></body></html>
